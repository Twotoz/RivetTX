name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native core and simulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and run unit tests
        run: make test

      - name: Build and run simulator
        run: |
          make build/rivettx-sim
          ./build/rivettx-sim

  esp32c3:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          path: "."
