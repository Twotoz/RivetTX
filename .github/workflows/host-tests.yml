name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native core and simulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and run unit tests
        run: make test

      - name: Build and run simulator
        run: |
          make build/rivettx-sim
          ./build/rivettx-sim

      - name: Run memory and undefined-behaviour checks
        run: make sanitize

  esp:
    name: ${{ matrix.name }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32c3
            name: ESP32-C3
          - target: esp32s3
            name: ESP32-S3
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: ${{ matrix.target }}
          path: "."
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin
            -o rivettx-factory.bin
            @flash_args

      - name: Verify firmware headroom
        run: |
          firmware_size=$(stat -c %s build/rivettx.bin)
          maximum_size=$((0x1A0000 * 90 / 100))
          echo "Firmware size: ${firmware_size} bytes; CI limit: ${maximum_size} bytes"
          test "${firmware_size}" -le "${maximum_size}"

      - name: Package flashable firmware
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          firmware_dir=firmware
          mkdir -p "${firmware_dir}/bootloader"
          mkdir -p "${firmware_dir}/partition_table"
          cp build/rivettx-factory.bin "${firmware_dir}/"
          cp build/rivettx.bin "${firmware_dir}/"
          cp build/bootloader/bootloader.bin "${firmware_dir}/bootloader/"
          cp build/partition_table/partition-table.bin "${firmware_dir}/partition_table/"
          cp build/ota_data_initial.bin "${firmware_dir}/"
          cp build/flash_args "${firmware_dir}/"
          cp build/flasher_args.json "${firmware_dir}/"
          cp docs/firmware-bundle.md "${firmware_dir}/README.md"
          printf '%s\n' "${SOURCE_COMMIT}" > "${firmware_dir}/SOURCE_COMMIT"
          printf '%s\n' "${TARGET}" > "${firmware_dir}/TARGET"
          cd "${firmware_dir}"
          sha256sum \
            rivettx-factory.bin \
            rivettx.bin \
            bootloader/bootloader.bin \
            partition_table/partition-table.bin \
            ota_data_initial.bin \
            flash_args \
            flasher_args.json \
            SOURCE_COMMIT \
            TARGET \
            README.md > SHA256SUMS

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v7
        with:
          name: rivettx-${{ matrix.target }}-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
